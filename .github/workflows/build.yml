name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: node build.js

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: latest
          tag_name: latest
          files: dist/ai-summary.user.js
